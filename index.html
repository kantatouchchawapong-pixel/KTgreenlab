
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลอยกระทงออนไลน์ | KT Green Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Prompt,sans-serif;
 background:linear-gradient(#071d2b,#123d45);
 color:#fff;min-height:100vh;
}
header{
 padding:18px;text-align:center;
 background:#092b30;border-bottom:1px solid #ffffff22;
}
header h1{margin:0;font-size:25px}
header p{font-size:12px;color:#c5e5d8;margin:5px}
main{max-width:850px;margin:auto;padding:22px 15px}
.panel{
 background:#ffffff12;border:1px solid #ffffff25;
 border-radius:18px;padding:20px;margin-bottom:16px;
}
h2{font-size:18px;margin-top:0}
label{font-size:13px}
input,textarea,select{
 width:100%;padding:12px;margin:7px 0 14px;
 border:1px solid #ffffff44;border-radius:10px;
 background:#092b30;color:white;font:inherit;
}
textarea{min-height:85px;resize:vertical}
button{
 border:0;border-radius:10px;padding:12px 18px;
 background:#f3c969;color:#26352b;
 font:600 14px Prompt;cursor:pointer;
}
button:disabled{opacity:.6;cursor:not-allowed}
.choices{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 15px}
.choice{
 flex:1;min-width:100px;padding:15px 8px;
 border:1px solid #ffffff44;border-radius:12px;
 text-align:center;cursor:pointer;background:#ffffff0c;
}
.choice.active{border:2px solid #f3c969;background:#ffffff20}
#pond{
 height:330px;position:relative;overflow:hidden;
 border-radius:18px;
 background:linear-gradient(#164c56,#092c3d);
 border:1px solid #ffffff33;
}
.waterline{
 position:absolute;left:-20%;width:140%;height:2px;
 background:#a6e8df55;animation:wave 5s linear infinite;
}
.waterline:nth-child(2){top:40%;animation-delay:-2s}
.waterline:nth-child(3){top:70%;animation-delay:-3s}
@keyframes wave{
 from{transform:translateX(-5%)}
 to{transform:translateX(5%)}
}
.krathong{
 position:absolute;bottom:45px;left:50%;
 transform:translateX(-50%);
 font-size:55px;filter:drop-shadow(0 0 12px #ffd66b);
 animation:float 5s ease-in-out forwards;
}
@keyframes float{
 0%{left:50%;bottom:35px;opacity:1;transform:translateX(-50%) scale(1)}
 100%{left:90%;bottom:230px;opacity:0;transform:translateX(-50%) scale(.45)}
}
#message{text-align:center;color:#f8df9c;font-size:13px;min-height:25px;margin-top:12px}
footer{text-align:center;padding:22px;color:#b7d4cb;font-size:11px}
</style>
</head>
<body>

<header>
 <h1>🌕 ลอยกระทงออนไลน์</h1>
 <p>KT Green Hub · ร่วมสืบสานประเพณีไทยอย่างเป็นมิตรต่อสิ่งแวดล้อม</p>
</header>

<main>
 <section class="panel">
  <h2>🪷 เลือกกระทงของคุณ</h2>
  <div class="choices" id="choices">
   <div class="choice active" data-symbol="🪷">🪷<br>กระทงดอกบัว</div>
   <div class="choice" data-symbol="🌸">🌸<br>กระทงดอกไม้</div>
   <div class="choice" data-symbol="🍃">🍃<br>กระทงใบตอง</div>
  </div>

  <label for="wish">คำอธิษฐาน (ไม่บังคับ)</label>
  <textarea id="wish" maxlength="180" placeholder="เขียนคำอธิษฐานของคุณ..."></textarea>

  <button id="floatButton" onclick="floatKrathong()">ลอยกระทงของฉัน</button>
  <div id="message"></div>
 </section>

 <section class="panel">
  <h2>🌊 สายน้ำแห่งคำอธิษฐาน</h2>
  <div id="pond">
   <div class="waterline" style="top:20%"></div>
   <div class="waterline"></div>
   <div class="waterline"></div>
  </div>
  <p style="font-size:11px;color:#c5e5d8">
   กระทงจะแสดงเป็นภาพเคลื่อนไหวบนหน้าจอเท่านั้น ไม่มีการบันทึกข้อมูลลงเซิร์ฟเวอร์
  </p>
 </section>
</main>

<footer>
 KT GREEN HUB · ONLINE LOY KRATHONG
</footer>

<script>
let selected="🪷";

document.querySelectorAll(".choice").forEach(choice=>{
 choice.addEventListener("click",()=>{
  document.querySelectorAll(".choice").forEach(c=>c.classList.remove("active"));
  choice.classList.add("active");
  selected=choice.dataset.symbol;
 });
});

function floatKrathong(){
 const pond=document.getElementById("pond");
 const button=document.getElementById("floatButton");
 const message=document.getElementById("message");
 const wish=document.getElementById("wish").value.trim();

 const krathong=document.createElement("div");
 krathong.className="krathong";
 krathong.textContent=selected;
 pond.appendChild(krathong);

 button.disabled=true;
 message.textContent=wish
  ? "ขอให้คำอธิษฐานของคุณเป็นจริง ✨"
  : "กระทงของคุณกำลังลอยไปกับสายน้ำ";

 setTimeout(()=>{
  krathong.remove();
  button.disabled=false;
 },5200);
}
</script>

</body>
</html>
